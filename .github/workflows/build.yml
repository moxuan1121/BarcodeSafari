name: Build RootHide deb

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-roothide:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install RootHide Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang make perl git wget xz-utils fakeroot rsync dpkg-dev libplist-utils
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/roothide/theos.git "$HOME/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          cp -R "$RUNNER_TEMP/sdks/iPhoneOS15.6.sdk" "$HOME/theos/sdks/"
          test -d "$HOME/theos/sdks/iPhoneOS15.6.sdk"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build RootHide package
        env:
          THEOS_PACKAGE_SCHEME: roothide
        run: |
          command -v dm.pl
          command -v fakeroot
          test -d "$THEOS/sdks/iPhoneOS15.6.sdk"
          make --version | head -n 1
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide V=1
          test -n "$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          dpkg-deb --info packages/*.deb

      - name: Upload RootHide deb
        uses: actions/upload-artifact@v4
        with:
          name: barcode-safari-roothide-deb
          path: packages/*.deb
          if-no-files-found: error
